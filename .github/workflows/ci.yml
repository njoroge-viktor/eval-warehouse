name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dbt-duckdb
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Load seeds
        run: dbt seed

      - name: Build models and run all tests
        run: dbt build

      - name: Verify the analysis query compiles
        run: dbt compile --select leaderboard_report
